<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HobbyHub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      text-align: center;
      padding: 40px 32px;
      max-width: 360px;
      width: 100%;
    }
    .logo { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .sub {
      font-size: 14px;
      color: #888;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .btn-app {
      display: block;
      background: linear-gradient(135deg, #a855f7, #6bcb77);
      color: #fff;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .btn-store {
      display: block;
      background: #1e1e2e;
      color: #ccc;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      border: 1px solid #333;
    }
    .btn-store:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎯</div>
    <h1>HobbyHub</h1>
    <p class="sub">취미를 기록하고 함께하는 커뮤니티<br>앱에서 게시글을 확인해보세요!</p>
    <a id="deeplink-btn" class="btn-app" href="#">앱에서 열기</a>
    <a class="btn-store"
       href="https://play.google.com/store/apps/details?id=kr.hobbyhub.app"
       target="_blank">
      📲 Google Play에서 다운로드
    </a>
  </div>

  <script>
    // /hobbyhub-share/post/{id} 경로 파싱
    const path = window.location.pathname;
    const match = path.match(/\/hobbyhub-share\/post\/([^/]+)/);
    const postId = match ? match[1] : null;

    const btn = document.getElementById('deeplink-btn');
    if (postId) {
      // 앱 딥링크 시도 후 실패하면 스토어로 유도
      btn.href = 'intent://sinou3936.github.io/hobbyhub-share/post/' + postId +
        '#Intent;scheme=https;package=kr.hobbyhub.app;' +
        'S.browser_fallback_url=https://play.google.com/store/apps/details?id=kr.hobbyhub.app;end';
    } else {
      btn.href = 'intent://#Intent;scheme=hobbyhub;package=kr.hobbyhub.app;' +
        'S.browser_fallback_url=https://play.google.com/store/apps/details?id=kr.hobbyhub.app;end';
    }
  </script>
</body>
</html>
